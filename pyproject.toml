[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "elementor-mcp-lite"
version = "0.1.0"
description = "Limited read-only MCP client for Elementor"
readme = "README.md"
requires-python = ">=3.10"
license = "LicenseRef-GMC-Lite-Commercial"
license-files = ["LICENSE"]
authors = [{name = "GMC", email = "gmcfuerte@gmail.com"}]
dependencies = ["mcp>=1.2.0,<2", "httpx>=0.27.0,<1"]

[project.scripts]
elementor-mcp-lite = "elementor_mcp_lite.__main__:main"

[project.urls]
Repository = "https://github.com/gmcfuerte/elementor-mcp-lite"
Homepage = "https://fuerteventuratv.net/en/cms"

[tool.setuptools.packages.find]
where = ["."]
include = ["elementor_mcp_lite*"]
